<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sailGradV2" x1="100" y1="0" x2="100" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC" />
      <stop offset="1" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="150" x2="200" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF" stop-opacity="0.8" />
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Dynamic Water/Waves - More splashy for V2 -->
  <path d="M20 160 Q 60 150 90 165 T 160 160 T 220 170" stroke="url(#waterGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <path d="M0 170 Q 50 165 100 175 T 190 165" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <path d="M40 155 Q 80 145 120 160" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4" />

  <!-- Group for the Boat - Tilted for action -->
  <g transform="rotate(-5, 100, 100)">
    <!-- Hull -->
    <path 
      d="M60 145 C 60 145 75 165 120 160 C 155 155 165 135 165 135 L 60 145 Z" 
      fill="#1E3A8A" 
      stroke="#172554" 
      stroke-width="1.5"
    />
    
    <!-- Mast -->
    <path d="M115 148 L 145 30" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Main Sail - Billowing -->
    <path 
      d="M118 145 L 146 32 L 175 125 Q 145 135 118 145 Z" 
      fill="url(#sailGradV2)" 
      stroke="#94A3B8" 
      stroke-width="0.5"
    />
    
    <!-- Jib Sail - Billowing -->
    <path 
      d="M110 142 L 142 35 L 75 125 Q 95 135 110 142 Z" 
      fill="url(#sailGradV2)" 
      stroke="#94A3B8" 
      stroke-width="0.5"
    />

    <!-- Italian Flag at Masthead -->
    <g transform="translate(144, 25) rotate(15)">
      <path d="M0 0 L 0 8 L 4 6 L 4 0 Z" fill="#16A34A" />
      <path d="M4 0 L 4 6 L 8 8 L 8 0 Z" fill="#FFFFFF" />
      <path d="M8 0 L 8 8 L 12 6 L 12 0 Z" fill="#DC2626" />
    </g>
  </g>
</svg>
