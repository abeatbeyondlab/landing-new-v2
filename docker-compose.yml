services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - WEBHOOK_CONTACT_FORM=ciaociao
      - TURBO_TELEMETRY_DISABLED=1
      - DO_NOT_TRACK=1
    restart: unless-stopped
    # Uncomment the following lines if you need to mount volumes for development
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    #   - /app/.next
